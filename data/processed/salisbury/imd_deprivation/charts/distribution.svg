<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dist-title dist-desc"><title id="dist-title">IMD decile distribution across Salisbury's LSOAs</title><desc id="dist-desc">Bar chart showing how many of Salisbury's 28 LSOAs fall in each IMD decile from 1 (most deprived) to 10 (least deprived), IoD2025.</desc><text x="32" y="16" font-size="11" fill="var(--text-muted, #666)">Decile (1 = most deprived)</text><text x="52" y="46.0" font-size="12" text-anchor="end" fill="var(--text-muted, #666)">1</text><rect x="60" y="35.2" width="0.0" height="15.1" fill="#800026" /><text x="66.0" y="46.0" font-size="12" fill="var(--text, #222)">0</text><title>Decile 1: 0 LSOAs</title><text x="52" y="67.6" font-size="12" text-anchor="end" fill="var(--text-muted, #666)">2</text><rect x="60" y="56.8" width="274.0" height="15.1" fill="#b60026" /><text x="340.0" y="67.6" font-size="12" fill="var(--text, #222)">3</text><title>Decile 2: 3 LSOAs</title><text x="52" y="89.2" font-size="12" text-anchor="end" fill="var(--text-muted, #666)">3</text><rect x="60" y="78.4" width="91.3" height="15.1" fill="#db141e" /><text x="157.3" y="89.2" font-size="12" fill="var(--text, #222)">1</text><title>Decile 3: 1 LSOA</title><text x="52" y="110.8" font-size="12" text-anchor="end" fill="var(--text-muted, #666)">4</text><rect x="60" y="100.0" width="182.7" height="15.1" fill="#f43d25" /><text x="248.7" y="110.8" font-size="12" fill="var(--text, #222)">2</text><title>Decile 4: 2 LSOAs</title><text x="52" y="132.4" font-size="12" text-anchor="end" fill="var(--text-muted, #666)">5</text><rect x="60" y="121.6" width="548.0" height="15.1" fill="#fd7134" /><text x="614.0" y="132.4" font-size="12" fill="var(--text, #222)">6</text><title>Decile 5: 6 LSOAs</title><text x="52" y="154.0" font-size="12" text-anchor="end" fill="var(--text-muted, #666)">6</text><rect x="60" y="143.2" width="0.0" height="15.1" fill="#fd9d43" /><text x="66.0" y="154.0" font-size="12" fill="var(--text, #2