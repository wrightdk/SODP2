# ============================================================
# LOCALITY CONFIG — one file per place.
# This file IS the portability layer: a new town/city means a
# new file like this one, not a fork of the pipeline code.
#
# COVERAGE: England and Wales only. Geography fields below are
# derived from ONS lookup products (Built-Up Areas, LSOAs, PCON,
# PFA) that don't extend to Scotland or Northern Ireland — those
# use different statistical geographies from different agencies
# (National Records of Scotland; NISRA). A Scottish or NI locality
# would need an equivalent-but-different generator script, not
# just a new instance of this file.
# ============================================================

locality:
  name: "Salisbury"
  region: "Wiltshire"
  country: "England"
  slug: "salisbury"                      # used in URLs, file/data paths, site subdomain

# ----------------------------------------------------------------
# GEOGRAPHIC IDENTITY
# Generated by generate_locality_geography.py, which resolves a
# Built-Up Area (BUA) name against a stack of small ONS "best fit"
# lookup tables (LSOA-to-BUA-to-LAD, LSOA-to-PCON, LAD-to-PFA,
# LSOA/LAD-to-Ward, LSOA-to-Rural-Urban-Classification) plus one
# *queried* (not downloaded) hit against the National Statistics
# Postcode Lookup — a few MB of table downloads total, plus one
# filtered API call, not the full ~200MB NSPL/ONSPD file.
#
# BUA rather than LAD or ward: BUAs are ONS's own settlement
# boundaries, i.e. "Salisbury the town" rather than "Wiltshire the
# unitary authority" (LAD) or a hand-picked list of wards. This is
# what gives town-level precision without manual boundary-drawing.
#
# Only ONE field below is NOT generated by that script:
#   - centroid: from a one-off geocode lookup, not a bulk join
# (postcode_prefixes used to be a manual field too — it isn't
# anymore, see the note on that field below.)
# ----------------------------------------------------------------
geography:
  bua_code: "E63006038"                  # ONS Built-Up Area code — the real "Salisbury"
  bua_name: "Salisbury"
  local_authority_codes:                 # a list: a BUA can straddle more than one LAD
    - "E06000054"                        # Wiltshire Council
  county: "Wiltshire"
  postcode_prefixes:                     # resolved by QUERYING the NSPL feature service
    - "SP1"                              # (WHERE lsoa21cd IN <lsoa_codes below>), not by
    - "SP2"                              # downloading it or hand-typing — see script notes
  police_force: "Wiltshire Police"       # from LAD -> CSP -> PFA lookup
  parliamentary_constituencies:          # from LSOA -> PCON lookup; a list, since
    - "Salisbury"                        # a town occasionally spans more than one seat
  wards:                                 # from LSOA/LAD -> Ward best-fit lookup (step 4,
                                          # still not implemented in generate_locality_
                                          # geography.py — see CLAUDE.md). This list was a
                                          # fabricated placeholder until this session (it
                                          # didn't match any real Wiltshire division, old or
                                          # current boundary) — replaced with Wiltshire
                                          # Council's actual 8 Salisbury-area electoral
                                          # divisions, verified live against Democracy Club's
                                          # results data for both the 2021-05-06 and
                                          # 2025-05-01 elections (identical set both times, so
                                          # this is the stable current boundary, not a
                                          # one-election snapshot). See ingest/local_elections.py
                                          # docstring for why this list is NOT what that
                                          # script actually filters by.
    - "Salisbury Bemerton Heath"         # E05013462
    - "Salisbury Fisherton & Bemerton Village"  # E05013463
    - "Salisbury Harnham East"           # E05013464
    - "Salisbury Harnham West"           # E05013465
    - "Salisbury Milford"                # E05016256
    - "Salisbury St Edmund's"            # E05013467
    - "Salisbury St Francis & Stratford" # E05016257
    - "Salisbury St Paul's"              # E05013469
  rural_urban_classification: "Urban city and town"  # from LSOA -> RUC lookup;
                                          # dominant class across the BUA's LSOAs —
                                          # individual LSOAs may vary at the edges
  lsoa_codes:                            # the BUA's full LSOA membership — this is the
                                          # field everything else derives from. Generated
                                          # against the BUA lookup file, not maintained by
                                          # hand (previously only 3 of 28 were listed here —
                                          # regenerated during imd_deprivation ingestion work
                                          # since a partial list silently understated IMD).
    - "E01031980"
    - "E01031981"
    - "E01031982"
    - "E01031983"
    - "E01031984"
    - "E01031985"
    - "E01031986"
    - "E01032001"
    - "E01032002"
    - "E01032003"
    - "E01032005"
    - "E01032006"
    - "E01032008"
    - "E01032009"
    - "E01032012"
    - "E01032014"
    - "E01032015"
    - "E01032016"
    - "E01032017"
    - "E01032018"
    - "E01032019"
    - "E01032020"
    - "E01032021"
    - "E01032022"
    - "E01032023"
    - "E01032024"
    - "E01032025"
    - "E01034550"
  centroid:                              # one-off geocode, not derived from the lookups
    lat: 51.0693
    lon: -1.7957
  radius_km: 8                           # for lat/lng-radius style APIs (e.g. police.uk);
                                          # set manually alongside the centroid

# ----------------------------------------------------------------
# DATA SOURCES
# Each block: is it on, how does it filter to this locality, and
# any locality-specific overrides. The pipeline script for each
# source type is shared across all localities — only this config
# block changes per place.
# ----------------------------------------------------------------
sources:

  ons_population:
    enabled: true
    slug: "population"                    # URL segment for this source's own site page
                                           # (/data/<slug>/) and its Data hub row — the site
                                           # reads this rather than hardcoding "population"
                                           # in a template, see CLAUDE.md
    description: "ONS small-area population estimates, summed across the locality's LSOAs."
    geography_key: lsoa_codes             # was local_authority_codes, which summed to
                                           # Wiltshire's whole population (~500k), not
                                           # Salisbury's — matches imd_deprivation's pattern
                                           # now: sum ONS small-area estimates across the
                                           # BUA's actual LSOA membership instead
    update_frequency: "annual"            # small-area (LSOA) estimates are published once
                                           # a year, and lag ~1 year behind the district-level
                                           # mid-year estimates this used to read — not
                                           # quarterly, that was never correct for either

  police_crime:
    enabled: true
    slug: "crime"                         # URL segment — see ons_population.slug above
    description: "Monthly street-level crime incidents from police.uk, filtered to the local area."
    filter_method: "radius"               # options: radius | force_name — needs an algorithm
                                           # (centroid + radius_km together), not just a
                                           # single geography.* field, so it's filter_method,
                                           # not geography_key — see CLAUDE.md
    update_frequency: "monthly"

  companies_house:
    enabled: true
    slug: "companies"                     # URL segment — see ons_population.slug above
    description: "Active company registrations from Companies House, filtered by postcode."
    geography_key: postcode_prefixes      # was filter_by: "postcode_prefixes" — unified
                                           # onto geography_key since this is simple list
                                           # membership against one geography.* field, same
                                           # pattern as ons_population/imd_deprivation
    update_frequency: "monthly"

  # Council transparency publishing is the least standardised part
  # of UK local data — this is where per-locality reality lives.
  # The parser is INTENDED to be generic (reads `format` + `column_map`)
  # but ingest/council_transparency.py doesn't exist yet — investigated,
  # not built: the target page is behind a Cloudflare JS challenge that
  # plain HTTP requests can't pass. See CLAUDE.md for the full findings
  # before starting on this script, so you don't re-discover the same
  # blocker from scratch.
  council_transparency:
    enabled: true
    description: "Council payments over £500, published under the transparency code."
    council_name: "Wiltshire Council"
    spend_over_500_url: "https://www.wiltshire.gov.uk/open-data-payments"  # NOT a direct
                                           # file — a listing page grouped by financial
                                           # year; each month's real download URL has a
                                           # CMS-assigned ID only visible by rendering it
    format: "csv"                         # csv | pdf | xlsx — selects the right parser.
                                           # Confirmed correct against the real files
                                           # (the page mislabels them "Excel doc")
    column_map:                           # councils name columns differently — UNVERIFIED:
                                           # no file has ever been successfully downloaded
                                           # to check these against real headers (blocked
                                           # on Cloudflare, see above), so treat these three
                                           # names as a guess, not a confirmed schema
      amount: "Amount (£)"
      supplier: "Supplier Name"
      date: "Payment Date"
    update_frequency: "monthly"

  planning_register:
    enabled: false                        # not every locality launches with every source
    description: "Planning applications from the council's planning register."
    portal_url: null
    format: "pdf"

  # Unlike the other fields in `geography:`, IMD is a full per-LSOA table
  # (a deprivation decile per LSOA, not one summary value for the whole
  # town), so it's treated as a data source to join against lsoa_codes,
  # not a geography identifier resolved once at onboarding.
  imd_deprivation:
    enabled: true
    slug: "deprivation"                   # URL segment — see ons_population.slug above
    description: "English Indices of Deprivation — a per-LSOA relative deprivation ranking."
    geography_key: lsoa_codes
    # NB: "IMD" specifically is the English Indices of Deprivation
    # (published by the housing/communities department, not ONS).
    # A Welsh locality would need WIMD instead — different methodology,
    # not directly comparable to English IMD deciles. Same England/Wales
    # per-nation caveat as elsewhere in this file.
    update_frequency: "static"            # IMD is a periodic release, not routinely updated

  # Democracy Club's candidates/results database, filtered to one council
  # (Wiltshire) at ingest time via `council_name` — NOT filtered to
  # `geography.wards` at ingest. Two reasons: (1) the hemicycle chart
  # needs every division's result, not just Salisbury's, so ingest has
  # to keep the whole council's data anyway; (2) Wiltshire's division
  # boundaries changed between the 2017 and 2021 elections (confirmed
  # live — different names *and* GSS codes for the same area), so a
  # single static `wards` list can't correctly select "Salisbury's
  # divisions" across every election year the vote-share chart needs.
  # pipeline/elections_charts.py does that selection per-election-year
  # instead, by prefix-matching each division's name against
  # `geography.bua_name` ("Salisbury ") rather than list-membership
  # against `wards` — verified this correctly finds the same 8 divisions
  # in both the old (2017) and current (2021+) boundary sets. This is a
  # "portable in pattern, not in every specific" mechanism like
  # council_transparency/community_area_jsna — a council whose division
  # names don't carry the town name as a prefix would need a different
  # selection rule; `wards` above is kept as the human-readable current
  # list (useful for display), not as what this source actually filters
  # by.
  local_elections:
    enabled: true                         # Democracy Club is a real, unblocked, structured
                                           # source (verified live) — the ingestion script
                                           # this was waiting on now exists.
    slug: "local-elections"               # URL segment — see ons_population.slug's comment
                                           # elsewhere in this file for what this is for
    description: "Local council election results for Wiltshire Council, from Democracy Club."
    council_name: "Wiltshire Council"     # human-readable label; also cross-checked against
                                           # Democracy Club's own organisation_name field as a
                                           # sanity check that council_slug (below) resolved
                                           # to the right council.
    council_slug: "wiltshire"             # Democracy Club's own internal council identifier
                                           # (as used in its election_id/ballot_paper_id, e.g.
                                           # "local.wiltshire.<division>.<date>") — verified
                                           # live. Democracy Club's CSV export has no
                                           # council-name query parameter, only a regex against
                                           # this kind of id, so the slug has to be known
                                           # up front rather than derived from council_name by
                                           # guessing a slugification rule.
    update_frequency: "as elections occur"

  # General election results for the locality's Westminster constituency
  # (parliamentary_constituencies), also from Democracy Club — see
  # ingest/parliamentary_elections.py's docstring for why this reads
  # Democracy Club rather than the House of Commons Library's 1918-2019
  # archive the original brief for this source named: commonslibrary.
  # parliament.uk (and researchbriefings.files.parliament.uk, the direct
  # CSV host) both serve a Cloudflare JS challenge to non-browser clients
  # — confirmed live, same class of blocker as council_transparency's
  # wiltshire.gov.uk wall. Democracy Club covers general elections since
  # 2010 (2010/2015/2017/2019/2024 — five elections), which is enough for
  # "last 3" but not the full 1918 depth; flagging so a future session
  # doesn't assume 1918-onwards data actually exists on disk anywhere.
  parliamentary_elections:
    enabled: true
    slug: "general-elections"             # URL segment — see ons_population.slug's comment
                                           # elsewhere in this file for what this is for
    description: "General election results for the constituency, from Democracy Club."
    geography_key: parliamentary_constituencies  # simple list-membership against
                                           # post_label, same geography_key pattern as
                                           # ons_population/imd_deprivation/companies_house
    update_frequency: "as elections occur"

  # Wiltshire's Community Area Joint Strategic Needs Assessment (CAJSNA) —
  # see CLAUDE.md's "Sources that are portable in pattern, not in
  # specifics" section. This is a document-parsing source, not an API:
  # no geography_key, because the PDF isn't filtered against lsoa_codes
  # or any other geography.* list — it's a fixed per-area document keyed
  # by area_name below.
  #
  # CRITICAL: area_name is "Salisbury Community Area", NOT the same
  # boundary as geography.bua_name ("Salisbury" the Built-Up Area used by
  # every other source). Wiltshire's Community Areas are Area
  # Board/CAJSNA geographies (town plus surrounding villages/parishes) —
  # wider than the BUA. Figures from this source must never be presented
  # alongside BUA-based figures as if they describe the same population.
  # See ingest/community_area_jsna.py and CLAUDE.md for why this matters.
  community_area_jsna:
    enabled: true
    slug: "jsna"                          # URL segment — see ons_population.slug above
    description: "Selected indicators from Wiltshire Council's statutory Community Area JSNA."
    council_name: "Wiltshire Council"
    area_name: "Salisbury"                # the area-board name as it appears in the PDF's
                                           # own prose (e.g. "In Salisbury, 4.7% ...") — used
                                           # to build the extraction regexes, not a display label
    area_display_name: "Salisbury Community Area"  # what to show users — always this, never
                                           # just "Salisbury", to avoid implying BUA geography
    pdf_url: "https://www.wiltshireintelligence.org.uk/wp-content/uploads/2024/01/Salisbury.pdf"
    landing_page_url: "https://www.wiltshireintelligence.org.uk/cajsna/salisbury/"
    update_frequency: "irregular"         # no published cadence found on wiltshireintelligence.org.uk;
                                           # current edition is "CAJSNA 2024" (per the PDF's own title
                                           # page) — check the landing page by hand before assuming a
                                           # newer edition exists; don't guess a refresh schedule

# ----------------------------------------------------------------
# EDITORIAL PARAMETERS
# Controls when and how the narrative layer speaks — and is the
# main lever for keeping token spend low and articles meaningful.
# ----------------------------------------------------------------
narrative:
  project_name: "Open Salisbury"
  tagline: "Public data, decoded for Salisbury and South Wiltshire"
  voice_guide: "narrative/voice_salisbury.md"   # style guide, not the numbers themselves
  significance_threshold_pct: 10          # only draft an article if a stat moved >10%
  publishing_cadence: "monthly"

# ----------------------------------------------------------------
# SITE / BRANDING
# ----------------------------------------------------------------
site:
  base_url: "https://opensalisbury.github.io"
  accent_color: "#2C5F2D"
  logo: "assets/logo-salisbury.jpg"                 # locality-specific — was hardcoded in
                                                     # base.njk until this session; every
                                                     # locality needs its own logo file
  hero_image: "assets/hero-salisbury.jpg"           # locality-specific — every
                                                     # locality needs its own
                                                     # photo, not a shared default
  hero_image_credit: "Photo: Dan Wright, CC BY 4.0"
  social:
    twitter: null
