name: Deploy site to Pages

# Builds site/ with Eleventy and deploys the output via GitHub's native
# Pages actions (not a gh-pages branch). Requires the repo's Pages source
# to be set to "GitHub Actions" under Settings > Pages.
#
# This builds whatever data/processed/ already contains at the commit
# being deployed — it does not run any ingestion script itself. Wiring
# ingest/ into a workflow that then triggers this one is future work.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
